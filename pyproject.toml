[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-review-learning"
version = "0.1.0"
description = "Learn review conventions from human feedback and preserve them through MultiCloud BlobStore"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
