[github]
default_days = 30

[storage]
prefix = "review_knowledge"

[storage.aws]
bucket = "YOUR_S3_BUCKET"
region = "us-east-1"

[storage.gcp]
bucket = "YOUR_GCS_BUCKET"

[classification]
# Optional replacement patterns; usernames are never classification signals.
ai_patterns = ['<!--\s*review-source:\s*ai\s*-->', '(?im)^\s*(?:\*\*)?generated by (?:Claude Code|Copilot|CodeRabbit)\b']
